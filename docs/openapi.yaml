# Aperçu — ne pas utiliser comme contrat.
# Source de vérité : docs/openapi.json
#   python backend/scripts/export_openapi.py
# Live : GET http://localhost:8000/openapi.json  ·  Swagger http://localhost:8000/docs
# FastAPI 0.3.0 : login + password, Bearer, /capabilities, /pieces.
#
# Ce fichier liste les paths. Les schémas complets sont dans openapi.json.

openapi: 3.1.0
info:
  title: DigiScore-WA API
  version: 0.3.0
  description: >
    Copilote d'éligibilité et de plafond. Contrat Front ↔ Back = openapi.json
    ou GET /openapi.json. Auth démo : POST /auth/login { login, password }
    puis Authorization Bearer. Listes paginées : { items, page, page_size, total }.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Santé + ping BDD
  /capabilities:
    get:
      summary: Flags ML (stub, tout false)
  /auth/login:
    post:
      summary: Login démo agent | chef | cic + mot de passe
  /agences:
    get:
      summary: Agences (code, nom, ville, topologie)
  /institutions:
    get:
      summary: Autres IF coopec/banque/IMF (pas mobile money)
  /referentiels:
    get:
      summary: Enums métier
  /moi:
    get:
      summary: User JWT (même payload que le login)
  /produits:
    get:
      summary: Catalogue produits crédit
  /membres:
    get:
      summary: Recherche paginée (enveloppe .items)
  /membres/{membre_id}:
    get:
      summary: Fiche membre (agence, totaux, nb_comptes_externes)
  /membres/{membre_id}/historique:
    get:
      summary: Crédits, incidents, 30 mvts agence (pas un alias)
  /membres/{membre_id}/mouvements:
    get:
      summary: Livre agence paginé
  /membres/{membre_id}/comptes-externes:
    get:
      summary: Comptes ailleurs
  /membres/{membre_id}/mouvements-externes:
    get:
      summary: Relevé ailleurs paginé
  /demandes:
    get:
      summary: Liste paginée
    post:
      summary: Créer une demande
  /demandes/{demande_id}:
    get:
      summary: Dossier + collecte A–E + trésorerie + score
  /demandes/{demande_id}/scores:
    get:
      summary: Historique score_result_history
  /demandes/{demande_id}/collecte:
    get:
      summary: Collecte + trésorerie + patrimoine
    post:
      summary: Saisie A–E
  /demandes/{demande_id}/pieces:
    post:
      summary: Pièces / OCR
  /demandes/{demande_id}/analyser:
    post:
      summary: scoring.run + persist
  /demandes/{demande_id}/soumettre:
    post:
      summary: Soumettre (identité JWT)
  /demandes/{demande_id}/decision:
    post:
      summary: Avis chef / CIC
  /demandes/{demande_id}/memo:
    get:
      summary: Mémo
  /demandes/{demande_id}/amortissement:
    get:
      summary: Échéancier sur montant éligible
  /files/chef:
    get:
      summary: File chef (paginée)
  /files/cic:
    get:
      summary: File CIC (paginée)
  /vision/portefeuille:
    get:
      summary: Maquette M6
  /vision/recouvrement:
    get:
      summary: Maquette M7
